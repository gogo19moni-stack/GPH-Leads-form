<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رمز QR — استمارة GPH</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#eef3ec;--surface:#fbfdf9;--ink:#11332b;--muted:#4f6b62;--line:#c3d4c9;--accent:#0f5a46;--accent-ink:#fff;--gold:#b8892b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c211b;--surface:#12302a;--ink:#eef3e8;--muted:#9fb8ac;--line:#24493e;--accent:#e0bd68;--accent-ink:#0c211b;--gold:#e0bd68;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c211b;--surface:#12302a;--ink:#eef3e8;--muted:#9fb8ac;--line:#24493e;--accent:#e0bd68;--accent-ink:#0c211b;--gold:#e0bd68;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "Tajawal",Tahoma,sans-serif}
main{max-width:560px;margin:0 auto;padding:26px 18px 50px}
h1{font:700 26px/1.4 "Reem Kufi","Tajawal",sans-serif;margin:0 0 4px;text-align:center}
.lead{color:var(--muted);text-align:center;margin:0 0 20px}
label.t{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font:inherit;direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 16px;font-size:15px;color:var(--muted)}
.card{text-align:center;background:#fff;color:#11332b;border-radius:150px 150px 12px 12px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--gold);padding:40px 22px 24px;margin:26px 6px}
.card .b{font:500 20px "Reem Kufi","Tajawal",sans-serif;color:#b8892b;margin:0 0 6px}
.card .h{font:700 28px/1.3 "Reem Kufi","Tajawal",sans-serif;color:#0f5a46;margin:0}
.card .s{margin:2px 0 14px;color:#4f6b62}
#qr{width:260px;max-width:80%;margin:0 auto;padding:10px;background:#fff;border:2px solid #b8892b;border-radius:8px}
#qr svg{display:block;width:100%;height:auto}
.card .t2{font:700 20px "Reem Kufi","Tajawal",sans-serif;margin:14px 0 0;color:#0f5a46}
.err{color:#b3261e;min-height:22px;text-align:center}
.primary{display:block;margin:0 auto;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:12px 26px;font:700 17px "Tajawal",Tahoma,sans-serif;cursor:pointer}
.hint{color:var(--muted);font-size:14px;text-align:center}
@media print{body{background:#fff}.no-print{display:none!important}.card{box-shadow:0 0 0 2px #b8892b;margin:20px auto;max-width:420px}}
</style>
</head>
<body>
<main>
<h1 class="no-print">بطاقة رمز QR</h1>
<p class="lead no-print">ألصق رابط الاستمارة بعد نشرها على GitHub Pages، فتظهر بطاقة جاهزة للطباعة.</p>
<div class="no-print">
  <label class="t" for="u">رابط الاستمارة</label>
  <input type="text" id="u" placeholder="https://username.github.io/gph-leads-form/" autocomplete="off">
  <label class="chk"><input type="checkbox" id="v" checked> نسخة الزوار (تُخفي قسم «ممثل GPH» الخاص بالموظفين)</label>
  <p class="err" id="err" role="alert"></p>
</div>
<div class="card" id="card" hidden>
  <p class="b">بسم الله الرحمن الرحيم</p>
  <p class="h">بيت العطور العالمية</p>
  <p class="s">GPH</p>
  <div id="qr" role="img" aria-label="رمز QR لفتح الاستمارة"></div>
  <p class="t2">امسح الرمز لتعبئة الاستمارة</p>
</div>
<button class="primary no-print" id="p" type="button" hidden>طباعة البطاقة</button>
<p class="hint no-print" id="h" hidden>إن لم تعمل الطباعة من هذه الصفحة، فخذ لقطة شاشة للبطاقة أو افتح الصفحة في المتصفح مباشرة.</p>
</main>
<script>
(function(){
function $(i){return document.getElementById(i)}
function gen(){
  var raw=$("u").value.trim(),card=$("card");
  $("err").textContent="";
  if(!raw){card.hidden=true;$("p").hidden=true;$("h").hidden=true;return}
  if(!/^https:\/\/\S+$/i.test(raw)){$("err").textContent="الرابط يجب أن يبدأ بـ https://";card.hidden=true;return}
  var url=raw;
  if($("v").checked){url+=(raw.indexOf("?")>-1?"&":"?")+"v=1"}
  if(typeof qrcode!=="function"){$("err").textContent="تعذّر تحميل مولّد الرمز. تحقق من الاتصال بالإنترنت.";return}
  var q=qrcode(0,"M");q.addData(url);q.make();
  var n=q.getModuleCount(),m=2,s=n+m*2,d="";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
  $("qr").innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+s+' '+s+'" shape-rendering="crispEdges"><rect width="'+s+'" height="'+s+'" fill="#fff"/><path d="'+d+'" fill="#11332b"/></svg>';
  card.hidden=false;$("p").hidden=false;$("h").hidden=false;
}
$("u").addEventListener("input",gen);$("v").addEventListener("change",gen);
$("p").onclick=function(){try{window.print()}catch(e){}};
})();
</script>
</body>
</html>
